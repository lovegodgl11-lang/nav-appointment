<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Nav appointment </title><meta name="title" content="Nav appointment "><meta name="description" content="Update inbox "><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment &amp; Token Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .countdown-overdue { color: #ef4444; font-weight: bold; }
        #notification-badge, #inbox-badge { top: -4px; right: -4px; }
        .notification-dropdown { display: none; }
        .notification-dropdown.show { display: block; }
        .notification-item.unread { background-color: #eef2ff; }
        .hidden { display: none; }
    </style>


    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Receptionist Panel</h1>
            <div class="flex items-center gap-4">
                 <div class="relative">
                    <button id="notification-bell" class="relative text-gray-600 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="notification-badge" class="absolute bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></span>
                    </button>
                    <div id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl hidden z-20 border max-h-96 overflow-y-auto">
                        <!-- Notifications will be rendered here -->
                    </div>
                </div>
                 <div class="relative">
                    <button id="inbox-icon" class="relative text-gray-600 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <span id="inbox-badge" class="absolute bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></span>
                    </button>
                </div>
                <a href="Pc.html" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800">← Project Hub</a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-bold mb-4">New Appointment</h2>
                    <form id="appointment-form" class="space-y-4">
                        <div>
                            <label for="customer-name" class="block text-sm font-medium text-gray-700">Customer Name</label>
                            <input type="text" id="customer-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="">
                        </div>
                        <div>
                            <label for="customer-mobile" class="block text-sm font-medium text-gray-700">Mobile Number (10 digits)</label>
                            <input type="tel" id="customer-mobile" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="" pattern="\d{10}">
                        </div>
                        <div>
                            <label for="appointment-for" class="block text-sm font-medium text-gray-700">Appointment For</label>
                            <select id="appointment-for" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="">
                                <option value="Alterations">Alterations</option>
                                <option value="New Stitching">New Stitching</option>
                                <option value="Pickup">Order Pickup</option>
                                <option value="Other">Other Inquiry</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 font-semibold">Add to Queue</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                 <div class="bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">Live Queue</h2>
                        <button id="call-next-btn" class="bg-green-600 text-white py-2 px-6 rounded-md hover:bg-green-700 font-bold disabled:bg-green-300">Call Next</button>
                    </div>
                    <div class="max-h-96 overflow-y-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0">
                                <tr>
                                    <th class="px-4 py-3">Token #</th>
                                    <th class="px-4 py-3">Name</th>
                                    <th class="px-4 py-3">For</th>
                                    <th class="px-4 py-3">Status</th>
                                    <th class="px-4 py-3">Actions / ETA</th>
                                </tr>
                            </thead>
                            <tbody id="queue-tbody">
                                <!-- Queue items will be injected here -->
                            </tbody>
                        </table>
                    </div>
                 </div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="hidden fixed bottom-5 right-5 bg-gray-900 text-white py-2 px-4 rounded-lg shadow-lg"></div>
    
    <div id="inbox-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[80vh]">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold">Message Inbox</h3>
                <button id="inbox-close-btn" class="text-gray-500 hover:text-gray-800 text-2xl">×</button>
            </div>
            <div id="inbox-list" class="overflow-y-auto p-2">
                <!-- Messages will be rendered here as a table -->
            </div>
        </div>
    </div>


    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp"
        };
        
        let db;
        let countdownIntervals = {};
        let previousWorkerTasks = {};
        let workerTasks = {}; // Made global for access in countdown
        let workers = []; // To get worker names for notifications
        
        let notifications = [];
        let unreadCount = 0;
        let inboxUnreadCount = 0;
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-IN';
            speechSynthesis.speak(utterance);
        }

        // --- NOTIFICATION SYSTEM ---
        function addNotification(message, options = {}) {
            notifications.unshift({ id: Date.now(), message, read: false, timestamp: new Date(), ...options });
            unreadCount++;
            inboxUnreadCount++;
            updateNotificationUI();
            updateInboxBadge();
            renderInbox();
        }

        function updateNotificationUI() {
            const badge = document.getElementById('notification-badge');
            const dropdown = document.getElementById('notification-dropdown');
            
            badge.textContent = unreadCount;
            badge.classList.toggle('hidden', unreadCount === 0);

            renderNotifications();
        }
        
        function renderNotifications() {
            const dropdown = document.getElementById('notification-dropdown');
            if (notifications.length === 0) {
                dropdown.innerHTML = `<p class="p-4 text-center text-sm text-gray-500">No notifications</p>`;
            } else {
                 dropdown.innerHTML = notifications.map(n => `
                    <div class="p-3 border-b text-sm ${!n.read ? 'unread font-semibold' : 'text-gray-600'}">
                        ${n.message}
                    </div>
                `).join('');
            }
        }

        function updateInboxBadge() {
            const badge = document.getElementById('inbox-badge');
            badge.textContent = inboxUnreadCount;
            badge.classList.toggle('hidden', inboxUnreadCount === 0);
        }

        function renderInbox() {
            const inboxList = document.getElementById('inbox-list');
            if (notifications.length === 0) {
                inboxList.innerHTML = `<p class="p-8 text-center text-gray-500">Your inbox is empty.</p>`;
                return;
            }
            inboxList.innerHTML = `
                <table class="w-full text-sm">
                    <tbody>
                        ${notifications.map(n => `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-3">
                                    <p class="${!n.read ? 'font-semibold' : ''}">${n.message}</p>
                                    <p class="text-xs text-gray-500">${n.timestamp.toLocaleString()}</p>
                                </td>
                                <td class="p-3 text-right">
                                    <button onclick="deleteNotification(${n.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Remove</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function deleteNotification(id) {
            const index = notifications.findIndex(n => n.id === id);
            if (index > -1) {
                const wasUnread = !notifications[index].read;
                notifications.splice(index, 1);
                
                // Recalculate unread counts
                unreadCount = notifications.filter(n => !n.read).length;
                inboxUnreadCount = unreadCount; // Keep them in sync for simplicity

                updateNotificationUI();
                updateInboxBadge();
                renderInbox();
            }
        }
        
        function displayQueue(queueData, currentWorkerTasks) {
            const tbody = document.getElementById('queue-tbody');
            // Clear all existing intervals first to prevent memory leaks
            Object.values(countdownIntervals).forEach(clearInterval);
            countdownIntervals = {};
            
            if (Object.keys(queueData).length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">The queue is empty.</td></tr>';
                document.getElementById('call-next-btn').disabled = true;
                return;
            }

            const sortedQueue = Object.entries(queueData).sort(([, a], [, b]) => a.tokenNumber - b.tokenNumber);

            // 1. Build the entire HTML string first for performance and to ensure elements exist.
            const rowsHtml = sortedQueue.map(([key, customer]) => {
                let statusClass = '';
                let statusText = customer.status.charAt(0).toUpperCase() + customer.status.slice(1);
                if (customer.status === 'serving') {
                    statusClass = 'bg-green-100 text-green-800 font-bold';
                } else if (customer.status === 'waiting') {
                    statusClass = 'bg-yellow-100 text-yellow-800';
                } else { // completed
                     statusClass = 'bg-gray-100 text-gray-500 line-through';
                }

                let actionsHtml = `<button onclick="removeCustomer('${key}')" class="text-red-500 hover:text-red-700 text-xs font-semibold">Remove</button>`;
                
                if (customer.status === 'serving') {
                    const task = Object.values(currentWorkerTasks).find(t => t.orderId === key);
                    if (task && task.status === 'Completed') {
                        actionsHtml = `<span class="font-bold text-green-600">Task Complete!</span>`;
                    } else if (task && task.eta && task.etaSetTimestamp) {
                        // Just prepare the placeholder div. The countdown will be started later.
                        actionsHtml = `<div id="countdown-${key}" class="font-semibold text-lg">--:--</div>`;
                    } else {
                         actionsHtml = `<span class="text-xs text-gray-500">Awaiting worker ETA...</span>`;
                    }
                }

                return `
                    <tr class="border-b">
                        <td class="px-4 py-3 font-bold text-lg">${customer.tokenNumber}</td>
                        <td class="px-4 py-3">${customer.customerName}</td>
                        <td class="px-4 py-3 text-gray-600">${customer.appointmentFor}</td>
                        <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs ${statusClass}">${statusText}</span></td>
                        <td class="px-4 py-3">${actionsHtml}</td>
                    </tr>
                `;
            }).join('');
            
            // 2. Set the innerHTML of the table body in one go.
            tbody.innerHTML = rowsHtml;
            
            // 3. Now that all elements are in the DOM, iterate again to start countdowns.
            sortedQueue.forEach(([key, customer]) => {
                if (customer.status === 'serving') {
                    const task = Object.values(currentWorkerTasks).find(t => t.orderId === key);
                    // Add status check here
                    if (task && task.status !== 'Completed' && task.eta && task.etaSetTimestamp) {
                        startCountdown(key, task.eta, task.etaSetTimestamp);
                    }
                }
            });
            
            const hasWaiting = sortedQueue.some(([, cust]) => cust.status === 'waiting');
            document.getElementById('call-next-btn').disabled = !hasWaiting;
        }

        function startCountdown(orderId, etaMinutes, etaSetTimestamp) {
            const countdownEl = document.getElementById(`countdown-${orderId}`);
            if (!countdownEl) return;

            const updateCountdown = () => {
                const totalSeconds = etaMinutes * 60;
                const elapsedSeconds = (Date.now() - etaSetTimestamp) / 1000;
                const remainingSeconds = Math.max(0, totalSeconds - elapsedSeconds);

                if (remainingSeconds === 0) {
                    // THE FIX: Before declaring "Overdue", check the live status.
                    const liveTask = Object.values(workerTasks).find(t => t.orderId === orderId);
                    if (liveTask && liveTask.status === 'Completed') {
                        countdownEl.textContent = "Completed!";
                        countdownEl.classList.remove('countdown-overdue');
                    } else {
                        countdownEl.textContent = "Overdue";
                        countdownEl.classList.add('countdown-overdue');
                    }
                    clearInterval(countdownIntervals[orderId]);
                } else {
                    const minutes = Math.floor(remainingSeconds / 60);
                    const seconds = Math.floor(remainingSeconds % 60);
                    countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    countdownEl.classList.remove('countdown-overdue');
                }
            };

            updateCountdown();
            countdownIntervals[orderId] = setInterval(updateCountdown, 1000);
        }
        
        async function saveAppointment(e) {
            e.preventDefault();
            const form = e.target;
            const name = form.querySelector('#customer-name').value;
            const mobile = form.querySelector('#customer-mobile').value;
            const appointmentFor = form.querySelector('#appointment-for').value;

            if (!name || !mobile) {
                showToast("Name and Mobile are required.");
                return;
            }
            
            try {
                const counterRef = db.ref('tokenCounter');
                const { committed, snapshot } = await counterRef.transaction(currentCount => {
                    return (currentCount || 0) + 1;
                });

                if (!committed) {
                    throw new Error("Could not get a new token number. Please try again.");
                }

                const newTokenNumber = snapshot.val();
                
                const queueRef = db.ref('tokenQueue');
                const newCustomerRef = queueRef.push();
                
                await newCustomerRef.set({
                    id: newCustomerRef.key,
                    tokenNumber: newTokenNumber,
                    customerName: name,
                    customerMobile: mobile,
                    appointmentFor: appointmentFor,
                    status: 'waiting',
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    notified: false
                });

                showToast(`Added ${name} to the queue with token #${newTokenNumber}`);
                form.reset();

            } catch (error) {
                console.error("Error saving appointment:", error);
                showToast("Failed to add to queue.");
            }
        }
        
        async function callNextCustomer() {
            const queueRef = db.ref('tokenQueue');
            const snapshot = await queueRef.orderByChild('status').equalTo('waiting').limitToFirst(1).once('value');
            
            const waitingCustomers = snapshot.val();
            if (!waitingCustomers) {
                showToast("No one is waiting in the queue.");
                return;
            }
            
            const nextCustomerId = Object.keys(waitingCustomers)[0];
            const nextCustomer = waitingCustomers[nextCustomerId];

            const servingSnapshot = await queueRef.orderByChild('status').equalTo('serving').once('value');
            const servingCustomer = servingSnapshot.val();
            
            const updates = {};
            updates[`/${nextCustomerId}/status`] = 'serving';
            updates[`/${nextCustomerId}/notified`] = false;

            if (servingCustomer) {
                const servingCustomerId = Object.keys(servingCustomer)[0];
                updates[`/${servingCustomerId}/status`] = 'completed';
            }
            
            await queueRef.update(updates);
            showToast(`Calling token #${nextCustomer.tokenNumber} - ${nextCustomer.customerName}`);
        }
        
        async function removeCustomer(customerId) {
            if (confirm("Are you sure you want to remove this person from the queue?")) {
                await db.ref('tokenQueue/' + customerId).remove();
                showToast("Removed from queue.");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
                
                db.ref().on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    const queueData = data.tokenQueue || {};
                    const newWorkerTasks = data.workerTasks || {};
                    workers = Object.values(data.workers || {});

                    // --- AUTOMATIC NOTIFICATION CLEANUP ---
                    const activeOrderIds = new Set(Object.values(queueData).filter(o => o.status === 'serving' || o.status === 'waiting').map(o => o.id));
                    const originalNotifCount = notifications.length;
                    
                    notifications = notifications.filter(n => {
                         if (!n.orderId) return true; // Keep notifications without an orderId (general ones)
                         return activeOrderIds.has(n.orderId);
                    });

                    if (notifications.length < originalNotifCount) {
                         unreadCount = notifications.filter(n => !n.read).length;
                         inboxUnreadCount = unreadCount;
                         updateNotificationUI();
                         updateInboxBadge();
                         renderInbox();
                    }
                    // --- END CLEANUP ---

                    // Check for completed tasks for voice notification
                    Object.keys(newWorkerTasks).forEach(taskId => {
                        const currentTask = newWorkerTasks[taskId];
                        const previousTask = previousWorkerTasks[taskId];

                        if (currentTask && previousTask) {
                            if (previousTask.status !== 'Completed' && currentTask.status === 'Completed') {
                                const customer = Object.values(queueData).find(c => c.id === currentTask.orderId);
                                if (customer) {
                                    const message = `${customer.customerName}'s task is complete.`;
                                    addNotification(message, { orderId: currentTask.orderId });
                                }
                            }
                            if (currentTask.delayReason && currentTask.delayReason !== previousTask.delayReason) {
                                const worker = workers.find(w => w.id === currentTask.assignedTo);
                                if(worker) {
                                    addNotification(`Delay from ${worker.name}: ${currentTask.delayReason}`, { orderId: currentTask.orderId });
                                }
                            }
                        }
                    });
                    
                    workerTasks = newWorkerTasks; // Update global state
                    previousWorkerTasks = newWorkerTasks; // Update state for next check
                    displayQueue(queueData, newWorkerTasks);
                });

                document.getElementById('appointment-form').addEventListener('submit', saveAppointment);
                document.getElementById('call-next-btn').addEventListener('click', callNextCustomer);
                
                // Notification Bell Listener
                const bell = document.getElementById('notification-bell');
                const dropdown = document.getElementById('notification-dropdown');
                bell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('show');
                    if (dropdown.classList.contains('show')) {
                        unreadCount = 0;
                        notifications.forEach(n => n.read = true);
                        updateNotificationUI();
                    }
                });
                document.addEventListener('click', (e) => {
                    if (!bell.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.classList.remove('show');
                    }
                });
                
                // Inbox Listeners
                const inboxIcon = document.getElementById('inbox-icon');
                const inboxModal = document.getElementById('inbox-modal');
                const inboxCloseBtn = document.getElementById('inbox-close-btn');

                inboxIcon.addEventListener('click', () => {
                    inboxModal.classList.remove('hidden');
                    inboxUnreadCount = 0;
                    updateInboxBadge();
                });

                inboxCloseBtn.addEventListener('click', () => {
                    inboxModal.classList.add('hidden');
                });


            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("Could not connect to the database. The app will not work.");
            }
        });

        window.removeCustomer = removeCustomer;
        window.deleteNotification = deleteNotification;
    </script>


<script src="./script.js"></script></body></html>
